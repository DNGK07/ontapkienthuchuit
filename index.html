<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Trắc Nghiệm KTCT - Doãn Nguyễn Gia Khang</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg-color: #f4f7f6;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
        }
        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            transition: 0.3s;
        }
        .btn:hover { background-color: #004494; }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }
        .question-box {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .question-title { font-weight: bold; margin-bottom: 15px; }
        .option {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
        /* Style cho kết quả */
        .correct-border { border: 2px solid var(--correct-color) !important; background-color: #e9f7ef; }
        .wrong-border { border: 2px solid var(--wrong-color) !important; background-color: #fceceb; }
        .answer-reveal {
            margin-top: 10px;
            padding: 10px;
            background: #e9f7ef;
            color: var(--correct-color);
            font-weight: bold;
            border-left: 4px solid var(--correct-color);
            display: none;
        }
        .controls { display: flex; gap: 10px; margin-top: 20px; justify-content: center;}
        #score-display { text-align: center; font-size: 24px; color: var(--primary); margin-bottom: 20px;}
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="home-screen">
        <h1>Hệ Thống Ôn Tập KTCT</h1>
        <p style="text-align: center;">Tài liệu nội bộ - Doãn Nguyễn Gia Khang</p>
        
        <div class="menu-section">
            <h3>Tạo câu hỏi ngẫu nhiên</h3>
            <button class="btn btn-outline" onclick="startRandomQuiz(10)">Làm 10 câu</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(20)">Làm 20 câu</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(30)">Làm 30 câu</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(50)">Làm 50 câu</button>
            
            <h3 style="margin-top: 20px;">Tạo câu hỏi cố định (Toàn bộ)</h3>
            <button class="btn" onclick="startFixedQuiz()">Làm toàn bộ 323 câu</button>

            <h3 style="margin-top: 20px;">Học từng câu (Quiz)</h3>
            <button class="btn btn-outline" onclick="startSingleQuiz(10)">Quiz 10 câu</button>
            <button class="btn btn-outline" onclick="startSingleQuiz(20)">Quiz 20 câu</button>
            <button class="btn btn-outline" onclick="startSingleQuiz(questionBank.length)">Quiz toàn bộ</button>
        </div>
    </div>

    <div id="quiz-screen" style="display: none;">
        <div id="questions-container"></div>
        <div class="controls" id="submit-controls">
            <button class="btn" onclick="submitQuiz()">Nộp bài</button>
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>

    <div id="single-quiz-screen" style="display: none;">
        <div id="single-question-container"></div>
        <div class="controls" id="single-controls" style="display: none;">
            <button class="btn" onclick="nextSingleQuestion()">Đi tiếp</button>
        </div>
        <div class="controls" style="margin-top: 20px;">
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div id="score-display"></div>
        <div class="controls">
            <button class="btn" onclick="regenerateQuiz()">Tạo lại câu hỏi</button>
            <button class="btn btn-outline" onclick="retryQuiz()">Làm lại</button>
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>
</div>

<script>
    /* =======================================================
       DỮ LIỆU CÂU HỎI
       Hãy dán toàn bộ 323 câu hỏi vào mảng questionBank này
    ======================================================= */
    const questionBank = [
        {
            id: 1,
            text: "Thuật ngữ 'kinh tế - chính trị' được sử dụng lần đầu tiên vào năm nào?",
            options: { A: "Năm 1610", B: "Năm 1615", C: "Năm 1815", D: "Năm 1848" },
            correct: "B",
            correctText: "Năm 1615"
        },
        {
            id: 2,
            text: "Ai là người đầu tiên đưa ra khái niệm 'kinh tế - chính trị'?",
            options: { A: "C. Mác (K. Marx)", B: "V.I. Lênin", C: "Antoine de Montchrestien", D: "William Petty" },
            correct: "C",
            correctText: "Antoine de Montchrestien"
        },
        {
            id: 3,
            text: "Ai là người được C. Mác coi là người sáng lập ra kinh tế chính trị tư sản cổ điển?",
            options: { A: "William Petty", B: "Adam Smith", C: "David Ricardo", D: "Thomas Mun" },
            correct: "A",
            correctText: "William Petty"
        },
        {
            id: 4,
            text: "Ai là người được coi là nhà kinh tế tiêu biểu của trường phái chủ nghĩa trọng thương?",
            options: { A: "Adam Smith", B: "Francois Quesnay", C: "Antoine de Montchrestien", D: "David Ricardo" },
            correct: "C", 
            correctText: "Antoine de Montchrestien"
        },
        {
            id: 5,
            text: "Kinh tế - chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của trường phái nào?",
            options: { A: "Chủ nghĩa trọng thương", B: "Chủ nghĩa trọng nông", C: "Kinh tế chính trị tư sản cổ điển Anh", D: "Kinh tế học tân cổ điển" },
            correct: "C",
            correctText: "Kinh tế chính trị tư sản cổ điển Anh"
        },
        {
            id: 6,
            text: "Sự khác nhau cơ bản giữa quy luật kinh tế và chính sách kinh tế là gì?",
            options: { A: "Quy luật kinh tế mang tính chủ quan, chính sách kinh tế mang tính khách quan", B: "Quy luật kinh tế mang tính khách quan, chính sách kinh tế mang tính chủ quan", C: "Cả hai đều mang tính khách quan", D: "Cả hai đều mang tính chủ quan do nhà nước ban hành" },
            correct: "B",
            correctText: "Quy luật kinh tế (khách quan) - Chính sách kinh tế (chủ quan)"
        },
        {
            id: 7,
            text: "Đối tượng nghiên cứu của kinh tế - chính trị Mác-Lênin là gì?",
            options: { A: "Các quy luật tự nhiên", B: "Lực lượng sản xuất", C: "Các quan hệ xã hội của sản xuất và trao đổi (quan hệ sản xuất)", D: "Kiến trúc thượng tầng" },
            correct: "C",
            correctText: "Quan hệ xã hội của sản xuất và trao đổi (Quan hệ sản xuất)"
        },
        {
            id: 8,
            text: "Đặc điểm của quy luật kinh tế là gì?",
            options: { A: "Mang tính chủ quan", B: "Mang tính khách quan", C: "Tồn tại vĩnh viễn không thay đổi", D: "Phụ thuộc vào ý chí của nhà nước" },
            correct: "B",
            correctText: "Khách quan"
        },
        {
            id: 9,
            text: "Để nghiên cứu kinh tế - chính trị Mác - Lênin có thể sử dụng nhiều phương pháp, phương pháp nào quan trọng nhất?",
            options: { A: "Phương pháp logic và lịch sử", B: "Phương pháp phân tích và tổng hợp", C: "Phương pháp điều tra thống kê", D: "Phương pháp trừu tượng hoá khoa học" },
            correct: "D",
            correctText: "Trừu tượng hóa khoa học"
        },
        {
            id: 10,
            text: "Montchrestien đã đề xuất môn khoa học mới - Khoa học kinh tế chính trị, trong tác phẩm nào?",
            options: { A: "Tư bản", B: "Chuyên luận về kinh tế chính trị", C: "Của cải của các dân tộc", D: "Những nguyên lý của kinh tế chính trị và thuế khóa" },
            correct: "B",
            correctText: "Chuyên luận về kinh tế chính trị"
        },
        {
            id: 11,
            text: "Trừu tượng hoá khoa học là phương pháp như thế nào?",

            correct: "B",
            correctText: "Gạt bỏ hiện tượng ngẫu nhiên, giữ lại bản chất"

        {
            id: 12,
            text: "Chức năng nhận thức của kinh tế - chính trị thể hiện ở nội dung nào?",

            correct: "B",
            correctText: "Cơ sở lý luận cho các khoa học kinh tế ngành/ứng dụng"
        },
        {
            id: 14,
            text: "Chức năng tư tưởng của kinh tế - chính trị Mác – Lê nin thể hiện ở nội dung nào?",
            options: { A: "Xây dựng thế giới quan khoa học, niềm tin vào sự tất thắng của Chủ nghĩa xã hội", B: "Phát hiện ra các quy luật kinh tế", C: "Đề ra các chính sách kinh tế", D: "Tính toán hiệu quả kinh doanh" },
            correct: "A",
            correctText: "Xây dựng thế giới quan khoa học, niềm tin vào CNXH"
        },
        {
            id: 15,
            text: "Bản chất khoa học và cách mạng của kinh tế - chính trị Mác - Lênin thể hiện ở chức năng nào?",
            options: { A: "Chức năng nhận thức", B: "Chức năng phương pháp luận", C: "Chức năng thực tiễn", D: "Thể hiện ở tất cả các chức năng" },
            correct: "D",
            correctText: "Tất cả các chức năng"
        },
        {
            id: 16,
            text: "Đặc điểm của chính sách kinh tế là gì?",
            options: { A: "Là sản phẩm chủ quan của nhà nước", B: "Tồn tại độc lập với ý thức con người", C: "Là quy luật của tự nhiên", D: "Không thể thay đổi" },
            correct: "A",
            correctText: "Sản phẩm chủ quan của nhà nước"
        },
        {
            id: 17,
            text: "Yếu tố nào giúp phân biệt giữa quy luật kinh tế và chính sách kinh tế?",
            options: { A: "Tính tất yếu và tính ngẫu nhiên", B: "Tính khách quan (quy luật) và tính chủ quan (chính sách)", C: "Tính lịch sử và tính vĩnh viễn", D: "Tính giai cấp và tính xã hội" },
            correct: "B",
            correctText: "Tính khách quan (quy luật) và chủ quan (chính sách)"
        },
        {
            id: 18,
            text: "Điều kiện ra đời của sản xuất hàng hóa là gì?",

            correct: "B",
            correctText: "Phân công LĐXH và Sự tách biệt kinh tế"
        },
        {
            id: 19,
            text: "Hàng hóa là gì?",
            options: { A: "Là bất cứ vật gì có sẵn trong tự nhiên", B: "Là sản phẩm của lao động, có thể thỏa mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán", C: "Là vật phẩm do con người tạo ra để tự tiêu dùng", D: "Là sản phẩm của lao động mang đi biếu, tặng" },
            correct: "B",
            correctText: "Sản phẩm lao động thỏa mãn nhu cầu qua trao đổi"
        },
        {
            id: 20,
            text: "Hàng hóa có mấy thuộc tính?",
            options: { A: "1 thuộc tính", B: "2 thuộc tính (Giá trị sử dụng và Giá trị)", C: "3 thuộc tính", D: "4 thuộc tính" },
            correct: "B",
            correctText: "2 thuộc tính (GTSD và Giá trị)"
        },
        {
            id: 21,
            text: "Giá trị sử dụng của hàng hóa là gì?",

            correctText: "Công dụng của vật phẩm"

            correctText: "Lao động xã hội kết tinh trong hàng hóa"

            correctText: "Biểu hiện bằng tiền của giá trị"

            id: 24,
            text: "Việc sản xuất và trao đổi hàng hóa dựa trên cơ sở nào?",

            correctText: "Hao phí thời gian LĐXH cần thiết"

        {
            id: 25,

            correctText: "Hàng hóa đặc biệt, vật ngang giá chung"

            correct: "C",
            correctText: "4 chức năng (trừ tiền tệ thế giới)"
        },
        {
            id: 28,
            text: "Lượng giá trị của một đơn vị hàng hóa phụ thuộc vào các yếu tố nào?",

            correct: "B",
            correctText: "Năng suất lao động và mức độ phức tạp của lao động"

        {

            correctText: "Thời gian LĐXH cần thiết"
        },
        {
            id: 30,
            text: "Tính chất hai mặt của lao động sản xuất hàng hóa là gì?",
            options: { A: "Lao động tư nhân và lao động xã hội", B: "Lao động quá khứ và lao động sống", C: "Lao động cụ thể và lao động trừu tượng", D: "Lao động giản đơn và lao động phức tạp" },
            correct: "C",
            correctText: "Lao động cụ thể và lao động trừu tượng"
        },
        {

            options: { A: "Đã trở thành một nước phát triển", B: "Đưa đất nước ra khỏi tình trạng kém phát triển, duy trì tốc độ tăng trưởng kinh tế khá cao", C: "Trở thành trung tâm tài chính lớn nhất thế giới", D: "Xóa bỏ hoàn toàn được hộ nghèo" },
            correct: "B",
            correctText: "Thoát khỏi kém phát triển, tăng trưởng khá"
        },
        {
            id: 323,
            text: "Vấn đề nào có ý nghĩa chiến lược quan trọng, quyết định sự thành công trong quá trình CNH - HĐH ở nước ta?",
            options: { A: "Xuất khẩu thật nhiều tài nguyên thô", B: "Phụ thuộc hoàn toàn vào vốn ODA", C: "Phát triển giáo dục - đào tạo và chuẩn bị nguồn nhân lực chất lượng cao", D: "Mở rộng diện tích đất nông nghiệp" },
            correct: "C",
            correctText: "Nguồn nhân lực chất lượng cao"
        }
        // DÁN CÁC CÂU HỎI TỪ 6 ĐẾN 323 CỦA BẠN VÀO ĐÂY LÀ XONG
    ];

    /* =======================================================
       LOGIC XỬ LÝ (JS)
    ======================================================= */
    let currentQuestions = [];
    let currentMode = ''; 
    let currentCount = 0; 
    
    // Các biến dùng riêng cho chế độ làm từng câu (Quiz)
    let currentSingleIndex = 0;
    let singleScore = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Chuyển đổi giữa các màn hình
    function switchScreen(screenId) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('single-quiz-screen').style.display = 'none';
        
        if(screenId === 'quiz-screen') {
            document.getElementById('submit-controls').style.display = 'flex';
        }
        document.getElementById(screenId).style.display = 'block';
    }

    // --- CÁC HÀM CHO CHẾ ĐỘ LÀM DÀI ---
    function startRandomQuiz(count) {
        currentMode = 'random';
        currentCount = count;
        let actualCount = Math.min(count, questionBank.length);
        let shuffled = shuffleArray(questionBank);
        currentQuestions = shuffled.slice(0, actualCount);
        renderQuestions();
        switchScreen('quiz-screen');
    }

    function startFixedQuiz() {
        currentMode = 'fixed';
        currentCount = questionBank.length;
        currentQuestions = [...questionBank]; 
        renderQuestions();
        switchScreen('quiz-screen');
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = ''; 
        
        currentQuestions.forEach((q, index) => {
            let html = `
                <div class="question-box" id="qbox-${index}">
                    <div class="question-title">Câu ${index + 1}: ${q.text}</div>
                    ${Object.keys(q.options).map(key => `
                        <label class="option">
                            <input type="radio" name="q-${index}" value="${key}">
                            ${key}. ${q.options[key]}
                        </label>
                    `).join('')}
                    <div class="answer-reveal" id="reveal-${index}">
                        Đáp án đúng: ${q.correctText}
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
        window.scrollTo(0, 0);
    }

    function submitQuiz() {
        let score = 0;
        
        currentQuestions.forEach((q, index) => {
            let selected = document.querySelector(`input[name="q-${index}"]:checked`);
            let box = document.getElementById(`qbox-${index}`);
            let reveal = document.getElementById(`reveal-${index}`);
            
            box.classList.remove('correct-border', 'wrong-border');

            if (selected) {
                if (selected.value === q.correct) {
                    score++;
                    box.classList.add('correct-border');
                } else {
                    box.classList.add('wrong-border');
                    reveal.style.display = 'block';
                }
            } else {
                box.classList.add('wrong-border');
                reveal.style.display = 'block';
            }
            
            let inputs = document.querySelectorAll(`input[name="q-${index}"]`);
            inputs.forEach(input => input.disabled = true);
        });

        document.getElementById('score-display').innerText = `Kết quả: Bạn làm đúng ${score} / ${currentQuestions.length} câu!`;
        document.getElementById('submit-controls').style.display = 'none'; 
        document.getElementById('result-screen').style.display = 'block'; 
    }

    // --- CÁC HÀM CHO CHẾ ĐỘ LÀM TỪNG CÂU (QUIZ) ---
    function startSingleQuiz(count) {
        currentMode = 'single';
        currentCount = count;
        currentSingleIndex = 0;
        singleScore = 0;
        
        let actualCount = Math.min(count, questionBank.length);
        let shuffled = shuffleArray(questionBank);
        currentQuestions = shuffled.slice(0, actualCount);
        
        renderSingleQuestion();
        switchScreen('single-quiz-screen');
    }

    function renderSingleQuestion() {
        const container = document.getElementById('single-question-container');
        document.getElementById('single-controls').style.display = 'none'; // Ẩn nút Đi tiếp ban đầu
        
        let q = currentQuestions[currentSingleIndex];
        
        let html = `
            <div class="question-box" id="single-qbox">
                <div class="question-title">Câu ${currentSingleIndex + 1} / ${currentQuestions.length}: ${q.text}</div>
                ${Object.keys(q.options).map(key => `
                    <label class="option">
                        <input type="radio" name="single-q" value="${key}" onchange="checkSingleAnswer()">
                        ${key}. ${q.options[key]}
                    </label>
                `).join('')}
                <div class="answer-reveal" id="single-reveal"></div>
            </div>
        `;
        container.innerHTML = html;
        window.scrollTo(0, 0);
    }

    function checkSingleAnswer() {
        let q = currentQuestions[currentSingleIndex];
        let selected = document.querySelector(`input[name="single-q"]:checked`);
        let box = document.getElementById('single-qbox');
        let reveal = document.getElementById('single-reveal');
        
        if (!selected) return; 
        
        // Khóa không cho chọn lại
        let inputs = document.querySelectorAll(`input[name="single-q"]`);
        inputs.forEach(input => input.disabled = true);
        
        // Chấm điểm ngay lập tức
        if (selected.value === q.correct) {
            singleScore++;
            box.classList.add('correct-border');
            reveal.innerHTML = "🎉 <b>Chính xác!</b> Đáp án: " + q.correctText;
            reveal.style.color = "var(--correct-color)";
        } else {
            box.classList.add('wrong-border');
            reveal.innerHTML = "❌ <b>Sai rồi!</b> Đáp án đúng: " + q.correctText;
            reveal.style.color = "var(--wrong-color)";
        }
        reveal.style.display = 'block';
        
        // Hiện nút Đi tiếp
        document.getElementById('single-controls').style.display = 'flex';
        let nextBtn = document.querySelector('#single-controls .btn');
        if (currentSingleIndex === currentQuestions.length - 1) {
            nextBtn.innerText = "Xem kết quả";
        } else {
            nextBtn.innerText = "Đi tiếp";
        }
    }

    function nextSingleQuestion() {
        if (currentSingleIndex < currentQuestions.length - 1) {
            currentSingleIndex++;
            renderSingleQuestion();
        } else {
            document.getElementById('score-display').innerText = `Kết quả: Bạn làm đúng ${singleScore} / ${currentQuestions.length} câu!`;
            switchScreen('result-screen');
        }
    }

    // --- CÁC HÀM TIỆN ÍCH CHUNG ---
    function regenerateQuiz() {
        if (currentMode === 'random') {
            startRandomQuiz(currentCount); 
        } else if (currentMode === 'single') {
            startSingleQuiz(currentCount); 
        } else {
            startFixedQuiz(); 
        }
    }

    function retryQuiz() {
        if (currentMode === 'single') {
            currentSingleIndex = 0;
            singleScore = 0;
            renderSingleQuestion();
            switchScreen('single-quiz-screen');
        } else {
            renderQuestions(); 
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('submit-controls').style.display = 'flex';
            window.scrollTo(0, 0);
        }
    }

    function goHome() {
        switchScreen('home-screen');
    }
</script>

</body>
</html>
