<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập - Doãn Nguyễn Gia Khang</title>
    <style>
        :root {
            --bg-color: #f8fafc; --container-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b;
            --primary: #2563eb; --border: #e2e8f0; --card-bg: #ffffff; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        body.dark-theme {
            --bg-color: #0f172a; --container-bg: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --primary: #38bdf8; --border: #334155; --card-bg: #1e293b; --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
        * { box-sizing: border-box; transition: all 0.3s; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 800px; background-color: var(--container-bg); padding: 50px 40px; border-radius: 24px; box-shadow: var(--shadow); position: relative; text-align: center; }
        .theme-toggle { position: absolute; top: 25px; right: 25px; background: var(--border); border: none; padding: 10px 16px; border-radius: 50px; cursor: pointer; color: var(--text-main); font-weight: 600; display: flex; gap: 8px; }
        h1 { font-size: 32px; color: var(--primary); margin: 0 0 8px 0; }
        p { color: var(--text-sub); margin: 0 0 40px 0; }
        .portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .subject-card { background-color: var(--card-bg); border: 2px solid var(--border); padding: 40px 30px; border-radius: 20px; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .subject-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .subject-card .icon { font-size: 55px; }
        .subject-card h2 { margin: 0; font-size: 22px; }
        @media (max-width: 600px) { .portal-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="light-theme">

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">Chế độ tối</span>
    </button>

    <h1>Hệ Thống Ôn Tập</h1>
    <p>Tài liệu nội bộ - Doãn Nguyễn Gia Khang</p>

    <div class="portal-grid">
        <div class="subject-card" onclick="window.location.href='ktct.html'">
            <div class="icon">⚖️</div>
            <h2>Ôn tập KTCT</h2>
            <span style="color: var(--text-sub);">Kinh tế Chính trị Mác-Lênin</span>
        </div>
        <div class="subject-card" onclick="window.location.href='vsvtp.html'">
            <div class="icon">🔬</div>
            <h2>Ôn tập VSVTP</h2>
            <span style="color: var(--text-sub);">Vi sinh vật thực phẩm</span>
        </div>
    </div>
</div>

<script>
    // Giữ đồng bộ Sáng/Tối giữa các trang web
    function toggleTheme() {
        const body = document.body;
        if (body.classList.contains('dark-theme')) {
            body.classList.remove('dark-theme');
            localStorage.setItem('theme', 'light');
            document.getElementById('theme-icon').innerText = "🌙";
            document.getElementById('theme-text').innerText = "Chế độ tối";
        } else {
            body.classList.add('dark-theme');
            localStorage.setItem('theme', 'dark');
            document.getElementById('theme-icon').innerText = "☀️";
            document.getElementById('theme-text').innerText = "Chế độ sáng";
        }
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-icon').innerText = "☀️";
        document.getElementById('theme-text').innerText = "Chế độ sáng";
    }
</script>
</body>
</html>
