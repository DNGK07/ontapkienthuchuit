<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập - Doãn Nguyễn Gia Khang</title>
    <style>
        /* Biến màu sắc giúp dễ dàng chuyển chế độ Sáng/Tối */
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body.dark-theme {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --border: #334155;
            --card-bg: #1e293b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* Nút chế độ Sáng/Tối */
        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--border);
            border: none;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 32px;
            margin: 0 0 8px 0;
            color: var(--primary);
        }

        header p {
            color: var(--text-sub);
            font-size: 16px;
            margin: 0;
        }

        /* Lưới 2 khung (Portal Grid) */
        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .subject-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .subject-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        .subject-card .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .subject-card h2 {
            margin: 0;
            font-size: 22px;
        }

        .subject-card p {
            font-size: 15px;
            color: var(--text-sub);
            margin: 0;
        }

        /* Nút quay lại */
        .btn-back {
            margin-top: 40px;
            background: none;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }

        .btn-back:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* Khung Menu sau khi click vào môn học */
        #subject-menu {
            display: none;
            text-align: center;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-outline {
            background: none;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .portal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="light-theme">

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">Chế độ tối</span>
    </button>

    <header>
        <h1 id="main-title">Hệ Thống Ôn Tập</h1>
        <p>Tài liệu nội bộ - Doãn Nguyễn Gia Khang</p>
    </header>

    <div id="portal-screen">
        <div class="portal-grid">
            <div class="subject-card" onclick="selectSubject('KTCT')">
                <div class="icon">⚖️</div>
                <h2>Ôn tập KTCT</h2>
                <p>Kinh tế Chính trị Mác-Lênin</p>
            </div>
            <div class="subject-card" onclick="selectSubject('VSVTP')">
                <div class="icon">🔬</div>
                <h2>Ôn tập VSVTP</h2>
                <p>Vi sinh vật thực phẩm</p>
            </div>
        </div>
    </div>

    <div id="subject-menu">
        <h2 id="selected-subject-title" style="color: var(--primary);">Tên môn học</h2>
        <p style="color: var(--text-sub);">Bạn đã chọn đúng môn, phần làm bài sẽ được tích hợp sau.</p>
        
        <div class="menu-options">
            <button class="btn-outline" onclick="alert('Tính năng đang được phát triển!')">Làm 10 câu ngẫu nhiên</button>
            <button class="btn-primary" onclick="alert('Tính năng đang được phát triển!')">Làm toàn bộ</button>
        </div>
        
        <button class="btn-back" id="back-btn" onclick="goBack()" style="display: block;">🔙 Quay lại trang chủ</button>
    </div>
</div>

<script>
    // 1. CHỨC NĂNG SÁNG TỐI
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        
        if (body.classList.contains('dark-theme')) {
            body.classList.remove('dark-theme');
            icon.innerText = "🌙";
            text.innerText = "Chế độ tối";
            localStorage.setItem('theme', 'light');
        } else {
            body.classList.add('dark-theme');
            icon.innerText = "☀️";
            text.innerText = "Chế độ sáng";
            localStorage.setItem('theme', 'dark');
        }
    }

    // Tự động load theme đã lưu
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-icon').innerText = "☀️";
        document.getElementById('theme-text').innerText = "Chế độ sáng";
    }

    // 2. CHỌN MÔN HỌC (CHUYỂN TRANG)
    function selectSubject(subject) {
        document.getElementById('portal-screen').style.display = 'none';
        document.getElementById('subject-menu').style.display = 'block';
        
        const title = document.getElementById('selected-subject-title');
        if(subject === 'KTCT') {
            title.innerText = "Ôn Tập Kinh Tế Chính Trị";
        } else if(subject === 'VSVTP') {
            title.innerText = "Ôn Tập Vi Sinh Vật Thực Phẩm";
        }
    }

    // 3. QUAY LẠI TRANG CHỦ
    function goBack() {
        document.getElementById('portal-screen').style.display = 'block';
        document.getElementById('subject-menu').style.display = 'none';
    }
</script>

</body>
</html>
