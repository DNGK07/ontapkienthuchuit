<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Trắc Nghiệm KTCT - Doãn Nguyễn Gia Khang</title>
    <meta name="description" content="Hệ thống ôn tập trắc nghiệm môn Kinh tế chính trị Mác - Lênin với hơn 300 câu hỏi.">
    <meta name="keywords" content="trắc nghiệm KTCT, kinh tế chính trị, ôn thi kinh tế chính trị, Doãn Nguyễn Gia Khang">
    <meta name="author" content="Doãn Nguyễn Gia Khang">
    
    <style>
        :root {
            --primary: #0056b3;
            --bg-color: #f4f7f6;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
            --text-color: #333;
            --container-bg: #fff;
            --border-color: #ddd;
        }

        .dark-mode {
            --primary: #4dabf7; 
            --bg-color: #121212; 
            --text-color: #f0f0f0; 
            --container-bg: #1e1e1e; 
            --border-color: #444; 
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            transition: 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 40px auto; /* Chừa khoảng trống phía trên cho nút theme */
            background: var(--container-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        h1 { text-align: center; color: var(--primary); }
        
        /* === NÚT CHUYỂN CHẾ ĐỘ LUÔN HIỆN HỮU === */
        .theme-toggle {
            position: fixed; /* Cố định ở góc màn hình */
            top: 15px;
            right: 15px;
            z-index: 1000;
            cursor: pointer;
            user-select: none;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .theme-toggle span { font-weight: bold; font-size: 14px; }
        #theme-icon { font-size: 18px; }

        .menu-section { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            transition: 0.3s;
        }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .dark-mode .btn { color: #000; } /* Chữ đen trên nền nút sáng ở dark mode cho dễ đọc */

        .question-box {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }
        .correct-border { border: 2px solid var(--correct-color) !important; background-color: rgba(40, 167, 69, 0.1); }
        .wrong-border { border: 2px solid var(--wrong-color) !important; background-color: rgba(220, 53, 69, 0.1); }
        .answer-reveal {
            margin-top: 10px; padding: 10px;
            background: rgba(40, 167,  green, 0.1);
            color: var(--correct-color);
            font-weight: bold;
            border-left: 4px solid var(--correct-color);
            display: none;
        }
        .controls { display: flex; gap: 10px; margin-top: 20px; justify-content: center;}
    </style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">
    <span>Chế độ</span>
    <span id="theme-icon">☀️</span>
</div>

<div class="container" id="app">
    <div id="home-screen">
        <h1>Hệ Thống Ôn Tập KTCT</h1>
        <p style="text-align: center;">Tài liệu nội bộ - Đại học Bách Khoa TP.HCM</p>
        
        <div class="menu-section">
            <h3>Tạo câu hỏi ngẫu nhiên</h3>
            <button class="btn btn-outline" onclick="startRandomQuiz(10)">Làm 10 câu</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(20)">Làm 20 câu</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(50)">Làm 50 câu</button>
            <button class="btn" onclick="startFixedQuiz()">Làm toàn bộ 323 câu</button>

            <h3 style="margin-top: 15px;">Học từng câu (Quiz)</h3>
            <button class="btn btn-outline" onclick="startSingleQuiz(10)">Quiz 10 câu</button>
            <button class="btn btn-outline" onclick="startSingleQuiz(questionBank.length)">Quiz toàn bộ</button>
        </div>
    </div>

    <div id="quiz-screen" style="display: none;">
        <div id="questions-container"></div>
        <div class="controls" id="submit-controls">
            <button class="btn" onclick="submitQuiz()">Nộp bài</button>
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>

    <div id="single-quiz-screen" style="display: none;">
        <div id="single-question-container"></div>
        <div class="controls" id="single-controls" style="display: none;">
            <button class="btn" onclick="nextSingleQuestion()">Đi tiếp</button>
        </div>
        <div class="controls" style="margin-top: 15px;">
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div id="score-display" style="text-align: center; font-size: 22px; margin-bottom: 20px;"></div>
        <div class="controls">
            <button class="btn" onclick="regenerateQuiz()">Tạo lại câu hỏi</button>
            <button class="btn btn-outline" onclick="retryQuiz()">Làm lại</button>
            <button class="btn btn-outline" onclick="goHome()">Quay về</button>
        </div>
    </div>
</div>

<script src="questions.js"></script>

<script>
    /* LOGIC CHUYỂN ĐỔI SÁNG TỐI */
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        body.classList.toggle('dark-mode');
        if (body.classList.contains('dark-mode')) {
            icon.innerText = '🌙';
            localStorage.setItem('ktct_theme', 'dark');
        } else {
            icon.innerText = '☀️';
            localStorage.setItem('ktct_theme', 'light');
        }
    }

    // Khôi phục chế độ khi load trang
    window.onload = () => {
        if (localStorage.getItem('ktct_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-icon').innerText = '🌙';
        }
    };

    /* LOGIC XỬ LÝ CHƯƠNG TRÌNH */
    let currentQuestions = [];
    let currentMode = ''; 
    let currentCount = 0; 
    let currentSingleIndex = 0;
    let singleScore = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function switchScreen(screenId) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('single-quiz-screen').style.display = 'none';
        document.getElementById(screenId).style.display = 'block';
        window.scrollTo(0, 0);
    }

    function startRandomQuiz(count) {
        currentMode = 'random'; currentCount = count;
        let actualCount = Math.min(count, questionBank.length);
        currentQuestions = shuffleArray(questionBank).slice(0, actualCount);
        renderQuestions();
        switchScreen('quiz-screen');
    }

    function startFixedQuiz() {
        currentMode = 'fixed'; currentQuestions = [...questionBank];
        renderQuestions();
        switchScreen('quiz-screen');
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = currentQuestions.map((q, index) => `
            <div class="question-box" id="qbox-${index}">
                <div style="font-weight:bold; margin-bottom:10px;">Câu ${index + 1}: ${q.text}</div>
                ${Object.keys(q.options).map(key => `
                    <label style="display:block; margin-bottom:8px; cursor:pointer;">
                        <input type="radio" name="q-${index}" value="${key}"> ${key}. ${q.options[key]}
                    </label>
                `).join('')}
                <div class="answer-reveal" id="reveal-${index}">Đáp án đúng: ${q.correctText}</div>
            </div>
        `).join('');
        document.getElementById('submit-controls').style.display = 'flex';
    }

    function submitQuiz() {
        let score = 0;
        currentQuestions.forEach((q, index) => {
            let selected = document.querySelector(`input[name="q-${index}"]:checked`);
            let box = document.getElementById(`qbox-${index}`);
            let reveal = document.getElementById(`reveal-${index}`);
            if (selected && selected.value === q.correct) {
                score++; box.classList.add('correct-border');
            } else {
                box.classList.add('wrong-border'); reveal.style.display = 'block';
            }
            document.querySelectorAll(`input[name="q-${index}"]`).forEach(i => i.disabled = true);
        });
        document.getElementById('score-display').innerText = `Bạn đúng ${score} / ${currentQuestions.length} câu!`;
        document.getElementById('submit-controls').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }

    function startSingleQuiz(count) {
        currentMode = 'single'; currentCount = count; currentSingleIndex = 0; singleScore = 0;
        let actualCount = Math.min(count, questionBank.length);
        currentQuestions = shuffleArray(questionBank).slice(0, actualCount);
        renderSingleQuestion();
        switchScreen('single-quiz-screen');
    }

    function renderSingleQuestion() {
        const container = document.getElementById('single-question-container');
        document.getElementById('single-controls').style.display = 'none';
        let q = currentQuestions[currentSingleIndex];
        container.innerHTML = `
            <div class="question-box" id="single-qbox">
                <div style="font-weight:bold; margin-bottom:10px;">Câu ${currentSingleIndex + 1}/${currentQuestions.length}: ${q.text}</div>
                ${Object.keys(q.options).map(key => `
                    <label style="display:block; margin-bottom:8px; cursor:pointer;">
                        <input type="radio" name="single-q" value="${key}" onchange="checkSingleAnswer()"> ${key}. ${q.options[key]}
                    </label>
                `).join('')}
                <div class="answer-reveal" id="single-reveal"></div>
            </div>
        `;
    }

    function checkSingleAnswer() {
        let q = currentQuestions[currentSingleIndex];
        let selected = document.querySelector(`input[name="single-q"]:checked`);
        let box = document.getElementById('single-qbox');
        let reveal = document.getElementById('single-reveal');
        document.querySelectorAll(`input[name="single-q"]`).forEach(i => i.disabled = true);
        if (selected.value === q.correct) {
            singleScore++; box.classList.add('correct-border');
            reveal.innerHTML = "✅ Đúng! Đáp án: " + q.correctText;
        } else {
            box.classList.add('wrong-border');
            reveal.innerHTML = "❌ Sai! Đáp án đúng: " + q.correctText;
        }
        reveal.style.display = 'block';
        document.getElementById('single-controls').style.display = 'flex';
    }

    function nextSingleQuestion() {
        if (currentSingleIndex < currentQuestions.length - 1) {
            currentSingleIndex++; renderSingleQuestion();
        } else {
            document.getElementById('score-display').innerText = `Kết quả Quiz: ${singleScore} / ${currentQuestions.length}`;
            switchScreen('result-screen');
        }
    }

    function goHome() { switchScreen('home-screen'); }
    function regenerateQuiz() { currentMode === 'single' ? startSingleQuiz(currentCount) : (currentMode === 'random' ? startRandomQuiz(currentCount) : startFixedQuiz()); }
    function retryQuiz() { if(currentMode==='single'){currentSingleIndex=0; singleScore=0; renderSingleQuestion(); switchScreen('single-quiz-screen');} else {renderQuestions(); document.getElementById('result-screen').style.display='none';} }
</script>
</body>
</html>
