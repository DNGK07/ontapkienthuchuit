<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập - Doãn Nguyễn Gia Khang</title>
    <style>
        /* Định nghĩa biến màu sắc cho 2 chế độ */
        :root {
            --primary: #0056b3;
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
            --box-bg: #ffffff;
            --card-hover: rgba(0, 86, 179, 0.1);
        }

        body.dark-theme {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --box-bg: #252525;
            --primary: #4791ff;
            --card-hover: rgba(71, 145, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        /* Nút chỉnh sáng tối */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        h1 { text-align: center; color: var(--primary); margin-top: 10px; }
        .menu-section { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        
        /* Layout cho trang chủ Portal */
        .portal-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .subject-card {
            background: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            width: 260px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .subject-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background-color: var(--card-hover);
        }

        .subject-card h2 { color: var(--primary); margin-top: 0; margin-bottom: 10px; }
        .subject-card p { margin: 0; font-size: 15px; opacity: 0.8; }

        .btn {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: var(--primary);
            color: white;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: #6c757d; }
        .btn-back { margin-top: 20px; width: 100%; }
        
        .question-box { 
            margin-bottom: 25px; 
            padding: 18px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            background: var(--box-bg);
        }
        .question-title { font-weight: bold; margin-bottom: 15px; line-height: 1.5; }
        .option { display: block; margin-bottom: 12px; cursor: pointer; }
        
        .correct-border { border: 2px solid var(--correct-color) !important; background-color: rgba(40, 167, 69, 0.1) !important; }
        .wrong-border { border: 2px solid var(--wrong-color) !important; background-color: rgba(220, 53, 69, 0.1) !important; }
        
        .answer-reveal {
            margin-top: 10px;
            padding: 10px;
            background: rgba(40, 167, 69, 0.15);
            color: var(--correct-color);
            font-weight: bold;
            border-left: 4px solid var(--correct-color);
            display: none;
        }

        .controls { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap;}
        #score-display { text-align: center; font-size: 24px; color: var(--primary); margin-bottom: 20px;}
    </style>
</head>
<body class="light-theme"> 
<div class="container" id="app">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Chế độ tối</button>
    
    <div id="portal-screen">
        <h1>Hệ Thống Ôn Tập</h1>
        <p style="text-align: center;">Tài liệu nội bộ - Doãn Nguyễn Gia Khang</p>
        
        <div class="portal-grid">
            <div class="subject-card" onclick="selectSubject('ktct')">
                <h2>📚 Ôn tập KTCT</h2>
                <p>Kinh tế Chính trị Mác - Lênin</p>
            </div>
            <div class="subject-card" onclick="selectSubject('vsvtp')">
                <h2>🔬 Ôn tập VSVTP</h2>
                <p>Vi sinh vật thực phẩm</p>
            </div>
        </div>
    </div>

    <div id="home-screen" style="display: none;">
        <h1 id="subject-title">Hệ Thống Ôn Tập</h1>
        
        <div class="menu-section">
            <h3>Tạo danh sách câu hỏi (Làm hàng loạt)</h3>
            <button class="btn btn-outline" onclick="startRandomQuiz(10)">Làm 10 câu ngẫu nhiên</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(20)">Làm 20 câu ngẫu nhiên</button>
            <button class="btn btn-outline" onclick="startRandomQuiz(40)">Làm 40 câu ngẫu nhiên</button>
            <button class="btn" onclick="startFixedQuiz()">Làm toàn bộ (Thứ tự gốc)</button>

            <h3 style="margin-top: 20px;">Học từng câu (Quiz)</h3>
            <button class="btn btn-outline" onclick="startSingleQuiz(10, true)">Quiz 10 câu (Ngẫu nhiên)</button>
            <button class="btn btn-outline" onclick="startSingleQuiz(20, true)">Quiz 20 câu (Ngẫu nhiên)</button>
            <button class="btn" onclick="startSingleQuiz(activeBank.length, false)">Quiz toàn bộ (Theo thứ tự gốc)</button>
            
            <button class="btn btn-secondary btn-back" onclick="goPortal()">🔙 Quay lại chọn môn khác</button>
        </div>
    </div>

    <div id="quiz-screen" style="display: none;">
        <div id="questions-container"></div>
        <div class="controls" id="submit-controls">
            <button class="btn" onclick="submitQuiz()">Nộp bài</button>
            <button class="btn btn-outline" onclick="goHome()">Trở về Menu môn học</button>
        </div>
    </div>

    <div id="single-quiz-screen" style="display: none;">
        <div id="single-question-container"></div>
        <div class="controls" id="single-navigation">
            <button class="btn btn-secondary" id="btn-prev" onclick="prevSingleQuestion()" style="display: none;">Câu trước</button>
            <button class="btn" id="btn-next" onclick="nextSingleQuestion()" style="display: none;">Đi tiếp</button>
        </div>
        <div class="controls" style="margin-top: 20px;">
            <button class="btn btn-outline" onclick="goHome()">Trở về Menu môn học</button>
        </div>
    </div>

    <div id="result-screen" style="display: none;">
        <div id="score-display"></div>
        <div class="controls">
            <button class="btn" onclick="regenerateQuiz()">Làm bộ mới</button>
            <button class="btn btn-outline" onclick="goHome()">Trở về Menu môn học</button>
        </div>
    </div>
</div>

<script src="questions.js"></script>
<script>
    // Dữ liệu ngân hàng câu hỏi đang được dùng
    let activeBank = []; 
    let currentQuestions = [];
    let userChoices = []; 
    let currentSingleIndex = 0;
    let currentMode = ''; 
    let currentCount = 0;
    let isRandomMode = false;

    // 1. CHỨC NĂNG SÁNG TỐI
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-btn');
        if (body.classList.contains('dark-theme')) {
            body.classList.remove('dark-theme');
            btn.innerText = "🌙 Chế độ tối";
            localStorage.setItem('theme', 'light');
        } else {
            body.classList.add('dark-theme');
            btn.innerText = "☀️ Chế độ sáng";
            localStorage.setItem('theme', 'dark');
        }
    }

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-btn').innerText = "☀️ Chế độ sáng";
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function switchScreen(screenId) {
        ['portal-screen', 'home-screen', 'quiz-screen', 'single-quiz-screen', 'result-screen'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
        document.getElementById(screenId).style.display = 'block';
    }

    // 2. CHỌN MÔN HỌC
    function selectSubject(subject) {
        if (subject === 'ktct') {
            activeBank = ktctBank;
            document.getElementById('subject-title').innerText = "Ôn Tập Kinh Tế Chính Trị";
        } else if (subject === 'vsvtp') {
            activeBank = vsvtpBank;
            document.getElementById('subject-title').innerText = "Ôn Tập Vi Sinh Vật Thực Phẩm";
        }
        switchScreen('home-screen');
    }

    function goPortal() {
        switchScreen('portal-screen');
    }

    function goHome() { 
        switchScreen('home-screen'); 
    }

    // 3. LOGIC LÀM HÀNG LOẠT
    function startRandomQuiz(count) {
        currentMode = 'batch';
        isRandomMode = true;
        currentCount = count;
        // Tránh lỗi nếu yêu cầu nhiều hơn số câu có trong bank
        let actualCount = Math.min(count, activeBank.length);
        currentQuestions = shuffleArray(activeBank).slice(0, actualCount);
        renderBatchQuestions();
        switchScreen('quiz-screen');
    }

    function startFixedQuiz() {
        currentMode = 'batch';
        isRandomMode = false;
        currentQuestions = [...activeBank];
        renderBatchQuestions();
        switchScreen('quiz-screen');
    }

    function renderBatchQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-box" id="batch-box-${i}">
                    <div class="question-title">Câu ${i + 1}: ${q.text}</div>
                    ${Object.keys(q.options).map(k => `
                        <label class="option">
                            <input type="radio" name="batch-q-${i}" value="${k}"> ${k}. ${q.options[k]}
                        </label>
                    `).join('')}
                    <div class="answer-reveal" id="batch-reveal-${i}">Đáp án đúng: ${q.correctText}</div>
                </div>`;
        });
        window.scrollTo(0, 0);
    }

    function submitQuiz() {
        let score = 0;
        currentQuestions.forEach((q, i) => {
            let selected = document.querySelector(`input[name="batch-q-${i}"]:checked`);
            let box = document.getElementById(`batch-box-${i}`);
            let reveal = document.getElementById(`batch-reveal-${i}`);
            box.classList.remove('correct-border', 'wrong-border');
            if (selected && selected.value === q.correct) {
                score++;
                box.classList.add('correct-border');
            } else {
                box.classList.add('wrong-border');
                reveal.style.display = 'block';
            }
            document.querySelectorAll(`input[name="batch-q-${i}"]`).forEach(inp => inp.disabled = true);
        });
        document.getElementById('score-display').innerText = `Kết quả: ${score} / ${currentQuestions.length}`;
        switchScreen('result-screen');
        window.scrollTo(0, 0);
    }

    // 4. LOGIC QUIZ TỪNG CÂU
    function startSingleQuiz(count, random) {
        currentMode = 'single';
        isRandomMode = random;
        currentCount = count;
        currentSingleIndex = 0;
        let actualCount = Math.min(count, activeBank.length);
        currentQuestions = random ? shuffleArray(activeBank).slice(0, actualCount) : activeBank.slice(0, actualCount);
        userChoices = new Array(currentQuestions.length).fill(null);
        renderSingleQuestion();
        switchScreen('single-quiz-screen');
    }

    function renderSingleQuestion() {
        const container = document.getElementById('single-question-container');
        const q = currentQuestions[currentSingleIndex];
        const savedChoice = userChoices[currentSingleIndex];
        container.innerHTML = `
            <div class="question-box" id="single-box">
                <div class="question-title">Câu ${currentSingleIndex + 1} / ${currentQuestions.length}: ${q.text}</div>
                ${Object.keys(q.options).map(k => `
                    <label class="option">
                        <input type="radio" name="sq" value="${k}" 
                            ${savedChoice === k ? 'checked' : ''} 
                            ${savedChoice !== null ? 'disabled' : ''} 
                            onchange="handleSingleChoice(this)"> 
                        ${k}. ${q.options[k]}
                    </label>
                `).join('')}
                <div class="answer-reveal" id="single-reveal" style="${savedChoice !== null ? 'display:block' : ''}">
                    ${savedChoice !== null ? (savedChoice === q.correct ? '🎉 Chính xác!' : '❌ Sai rồi! Đáp án đúng: ' + q.correctText) : ''}
                </div>
            </div>`;
        if (savedChoice !== null) document.getElementById('single-box').classList.add(savedChoice === q.correct ? 'correct-border' : 'wrong-border');
        updateNavigationButtons();
    }

    function handleSingleChoice(input) {
        const q = currentQuestions[currentSingleIndex];
        userChoices[currentSingleIndex] = input.value;
        document.querySelectorAll('input[name="sq"]').forEach(i => i.disabled = true);
        renderSingleQuestion();
    }

    function updateNavigationButtons() {
        document.getElementById('btn-prev').style.display = currentSingleIndex > 0 ? 'inline-block' : 'none';
        const btnNext = document.getElementById('btn-next');
        if (userChoices[currentSingleIndex] !== null) {
            btnNext.style.display = 'inline-block';
            btnNext.innerText = currentSingleIndex === currentQuestions.length - 1 ? "Xem kết quả" : "Đi tiếp";
        } else {
            btnNext.style.display = 'none';
        }
    }

    function nextSingleQuestion() {
        if (currentSingleIndex < currentQuestions.length - 1) {
            currentSingleIndex++;
            renderSingleQuestion();
        } else {
            let score = 0;
            userChoices.forEach((c, i) => { if (c === currentQuestions[i].correct) score++; });
            document.getElementById('score-display').innerText = `Kết quả: ${score} / ${currentQuestions.length}`;
            switchScreen('result-screen');
        }
    }

    function prevSingleQuestion() { if (currentSingleIndex > 0) { currentSingleIndex--; renderSingleQuestion(); } }

    function regenerateQuiz() {
        currentMode === 'batch' ? (isRandomMode ? startRandomQuiz(currentCount) : startFixedQuiz()) : startSingleQuiz(currentCount, isRandomMode);
    }
</script>
</body>
</html>
